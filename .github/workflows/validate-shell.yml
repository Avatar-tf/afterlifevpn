name: Validate shell scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate every Bash script
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if (( ${#scripts[@]} == 0 )); then
            echo "No shell scripts found."
            exit 1
          fi
          failed=0
          for script in "${scripts[@]}"; do
            if bash -n "$script"; then
              printf 'PASS %s\n' "$script"
            else
              printf 'FAIL %s\n' "$script"
              failed=1
            fi
          done
          exit "$failed"

      - name: Validate JSON files
        shell: bash
        run: |
          set -Eeuo pipefail
          if find . -type f -name '*.json' -not -path './.git/*' -print -quit | grep -q .; then
            while IFS= read -r -d '' file; do
              jq empty "$file" || exit 1
              echo "PASS $file"
            done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)
          fi
